name: Github Testing
on: [push, pull_request]


jobs:
  test:
    name: test (${{ matrix.os }})
    env:
      QLTY_COVERAGE_TOKEN: ${{ secrets.QLTY_COVERAGE_TOKEN }}
    services:
      postgres:
        image: postgres:17
        ports: ["5432:5432"]
        env:
          POSTGRES_PASSWORD: password
          POSTGRES_USERNAME: postgres
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04]
        # Read from .ruby-version instead of a second copy of the number here. CI used to be
        # pinned to 3.0.3 while .ruby-version had been bumped to 3.4.9, so the suite stayed
        # green on a Ruby the servers no longer ran and the breakage surfaced only on deploy.
        ruby: ['.ruby-version']
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ endsWith(matrix.ruby, 'head') || matrix.ruby == 'debug' }}
    steps:

      - uses: actions/checkout@v5
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true # runs 'bundle install' and caches installed gems automatically
      - name: config bundler
        run:  |
          bundle config set without 'development staging production'
          bundle config set deployment '[secure]'
          bundle env
          head -n1 $(which bundle)

      - name: Run Tests & generate coverage
        env:
          PG_DATABASE: postgres
          PG_HOST: localhost
          PG_USER: postgres
          PG_PORT: ${{ job.services.postgres.ports[5432] }}
          RAILS_ENV: test
          COVERAGE: true
          DISABLE_SPRING: 1
        run: |
          cp config/application-example.yml config/application.yml
          cp config/database-travis.yml config/database.yml
          bundle exec rake db:setup
          # Guards the autoloader: classic was removed in Rails 7.0, so a file whose
          # constant does not match its path stops being a style question and becomes a
          # boot failure. Cheaper to catch here than on deploy.
          bundle exec rails zeitwerk:check
          bundle exec rails test test/*

      # ------------------------------
      # Qlty.sh integration
      # ------------------------------
      - name: Install qlty CLI
        run: |
          curl -LSs https://qlty.sh | bash
          echo "${HOME}/.qlty/bin" >> $GITHUB_PATH

      - name: Upload coverage to Qlty
        if: env.QLTY_COVERAGE_TOKEN != ''
        run: |
          qlty coverage publish --report-format=simplecov coverage/.resultset.json
